#
# Scopes for cmd/staticreach: which entry points, which cuts, which runs are
# held to which scope. Changing this file changes the map; -scopes reads another.
#
#   entries <set> <class.name:descriptor>
#   cut <name> <class> <fromline> <toline> flag=<flag> why=<free text to end of line>
#   cutmethod <name> <class.name:descriptor> flag=<flag> why=<free text>
#   scope <name> entries=<set,...> cuts=<cut,...> [view=ntk-constant] why=<free text>
#   harness <name> dirs=<dir,...> roots=<class prefix,...> why=<free text>
#   run <glob> scope=<name> harness=<name> kind=<spec|test> [extracuts=<cut,...>]
#   explain <kind> <class.name:descriptor> why=<free text>
#   reflect <class.name:descriptor> <class> why=<free text>
#
# Paths are relative to the repository root.

# TLC's SpecProcessor.processSpec: SimpleSanyOutput, SanySettings.forExternalCaller
# and SANY.parse. Its specObj comes from Spec's constructor (SpecObj, or
# ParameterizedSpecObj when TLC has parameters) with TLC's resolver. They are roots
# because under RTA an argument that nobody created has no methods to dispatch to.
entries parse tla2sany/drivers/SANY.parse:(Ltla2sany/modanalyzer/SpecObj;Ljava/lang/String;Ltla2sany/output/SanyOutput;Ltla2sany/drivers/SanySettings;)Ltla2sany/drivers/SanyExitCode;
entries parse tla2sany/output/SimpleSanyOutput.<init>:(Ljava/io/PrintStream;Ltla2sany/output/LogLevel;)V
entries parse tla2sany/drivers/SanySettings.forExternalCaller:(Ljava/util/Set;Ljava/util/Set;)Ltla2sany/drivers/SanySettings;
entries parse tla2sany/modanalyzer/SpecObj.<init>:(Ljava/lang/String;Lutil/FilenameToStream;)V
entries parse tlc2/tool/impl/ParameterizedSpecObj.<init>:(Ltlc2/tool/impl/Spec;Lutil/FilenameToStream;Ljava/util/Map;)V
entries parse util/SimpleFilenameToStream.<init>:()V
entries parse util/SimpleFilenameToStream.<init>:(Ljava/lang/String;)V
entries parse util/SimpleFilenameToStream.<init>:([Ljava/lang/String;)V

entries cli tla2sany/SANY.main:([Ljava/lang/String;)V
entries xml tla2sany/xml/XMLExporter.main:([Ljava/lang/String;)V

# The one place that creates an Explorer: the body of if (doDebugging), line 758.
# The guard stays, because it runs; its true outcome goes with the cut.
cut explorer tla2sany/drivers/SANY 760 764 flag=-d why=The -d/-D block in SANYmain0: new Explorer and explorer.main.

# Flags that only enable debugging or dumping. Chris can veto any of these. -d is
# the explorer cut above. -stat is accepted and ignored, so it has no edge to cut.
cut tla-print tla2sany/modanalyzer/ParseUnit 370 370 flag=-DTLA-Print why=System property, value file: writeParseTreeToFile dumps the syntax tree to a file.
cut tla-print tla2sany/modanalyzer/ParseUnit 373 373 flag=-DTLA-Print why=System property, value on: writeParseTreeToFile dumps the syntax tree to stdout.
cut plain-formulae tla2sany/semantic/SemanticNode 473 474 flag=-Dtla2sany.semantic.SemanticNode.showPlainFormulae why=System property: toString(StringBuffer,String) prints the formula, not the location.
cut plain-formulae tla2sany/semantic/SemanticNode 485 486 flag=-Dtla2sany.semantic.SemanticNode.showPlainFormulae why=System property: toString() prints the formula, not the location.

# Chris's decision: cut, as a named entry he can veto. Delete this line and the
# name from scope port and the run rows to undo it. It is not a proof: nothing in
# the bytecode calls it or concatenates the type, and no report ever ran it, but
# showing that no SymbolTable reaches a JDK call would need points-to analysis.
# staticreach check fails if a direct call or concatenation appears or a report runs it.
cutmethod symboltable-tostring tla2sany/semantic/SymbolTable.toString:()Ljava/lang/String; flag=none why=No direct call or string concatenation on the type in bytecode, and no report ever ran it; only the assumption that the JDK may stringify any instantiated object keeps it.

# The first scope is the primary one and is reported first. The exporter scopes
# are secondary: XMLExporter is not part of parsing a spec, but the L3 differential
# oracle uses it as a test harness tool, so its runs land in the coverage reports.
scope cli-noexp entries=cli cuts=explorer why=Primary. tla2sany.SANY.main, the command line, with the Explorer cut and XMLExporter excluded.
scope port entries=cli cuts=explorer,symboltable-tostring view=ntk-constant why=What a port must match: tla2sany.SANY.main with the Explorer, XMLExporter and SymbolTable.toString cut, and the jj_ntk ternary reported as constant.
scope cli entries=cli cuts= why=The command line with all flags.
scope cli-nodebug entries=cli cuts=explorer,tla-print,plain-formulae why=The command line with every debug or dump flag cut.
scope cli+xml-noexp entries=cli,xml cuts=explorer why=The command line plus XMLExporter.main, Explorer cut.
scope cli+xml entries=cli,xml cuts= why=The command line plus XMLExporter.main.
scope cli+xml-nodebug entries=cli,xml cuts=explorer,tla-print,plain-formulae why=The command line plus XMLExporter.main, every debug or dump flag cut.
scope parse-noexp entries=parse cuts=explorer why=SANY.parse as TLC's SpecProcessor calls it, Explorer cut.
scope parse entries=parse cuts= why=SANY.parse as TLC's SpecProcessor calls it.

# Every reflective site in reached code must be resolved here, or the check fails.
reflect pcal/PcalResourceFileReader.<init>:(Ljava/lang/String;)V pcal/AST why=Class.forName of a constant name, only to find a resource next to that class.

harness none dirs= roots= why=Nothing beyond the product.

# Every report is also held to the SymbolTable.toString cut. Removing an edge only
# shrinks a scope, so each row below is stricter than the same row without it.
run data/staticreach/specs-cli.xml.gz scope=cli-nodebug harness=none kind=spec extracuts=symboltable-tostring
# The acceptance bar for port: the plain command line, no extra roots.
run data/staticreach/specs-cli.xml.gz scope=port harness=none kind=spec
